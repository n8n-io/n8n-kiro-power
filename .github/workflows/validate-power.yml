name: Validate power

on:
  pull_request:
  push:
    branches: [main, initial-power]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schemas:
    name: Agent Plugins schemas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check check-jsonschema==0.38.0
      - name: Validate plugin manifest
        run: >-
          check-jsonschema
          --schemafile https://agent-plugins.org/schemas/1.0.0/plugin.schema.json
          plugin.json
      - name: Validate MCP configuration
        run: >-
          check-jsonschema
          --schemafile https://agent-plugins.org/schemas/1.0.0/mcp.schema.json
          mcp.json
