name: Validate power

on:
  pull_request:
  push:
    branches: [main, initial-power]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schemas:
    name: Agent Plugins schemas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check check-jsonschema==0.38.0
      - name: Validate plugin manifest
        run: >-
          check-jsonschema
          --schemafile https://agent-plugins.org/schemas/1.0.0/plugin.schema.json
          plugin.json
      # Native Kiro OAuth settings are not portable Agent Plugins MCP settings.
      - name: Check skills-only packaging
        run: test ! -e mcp.json
  helper:
    name: Setup helper (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
